[build]
buildCommand = "DATABASE_URL=postgresql://placeholder pnpm install && pnpm run build:prod"

[deploy]
startCommand = "cd packages/server && npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/index.js"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
